# IFT3913 - Tâche 3
# Ce build est limité au module tika-parser-microsoft-module. Il est
# conditionné par une analyse Semgrep différentielle : le build échoue si un
# commit introduit une NOUVELLE alerte Semgrep dans le module (les alertes
# déjà présentes dans le commit de référence sont ignorées). Voir
# docs/tache3/README.md pour la justification des choix de conception.

name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    # Toutes les branches, pour que les branches de démonstration (commits
    # vulnérables, tests qui échouent) déclenchent aussi le pipeline.
    branches: [ '**' ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE: tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module
  SEMGREP_VERSION: '1.185.0'
  SEMGREP_RULES: '--config p/java --config p/security-audit --config p/owasp-top-ten'
  MAVEN_ARGS: '-B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'

jobs:
  semgrep:
    name: Semgrep (nouvelles alertes seulement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Historique complet : l'analyse différentielle a besoin du commit de référence.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Installer Semgrep ${{ env.SEMGREP_VERSION }}
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Déterminer le commit de référence
        id: baseline
        env:
          # Passées par env (jamais interpolées dans le script) pour éviter
          # une injection shell via le contenu de l'événement.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # Nouvelle branche (before = 000...), lancement manuel ou commit
          # inconnu (force-push) : on se replie sur le commit parent.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Commit de référence : $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Rapport Semgrep complet du module (informatif)
        # Rapport de TOUTES les alertes à ce commit, conservé comme artefact
        # pour comparer les rapports « avant » et « après ». N'échoue jamais.
        run: |
          semgrep scan --metrics=off $SEMGREP_RULES \
            --json --output semgrep-full.json "$MODULE" || true

      - name: Contrôle Semgrep - échec si nouvelles alertes
        env:
          BASELINE: ${{ steps.baseline.outputs.sha }}
        run: |
          semgrep scan --metrics=off $SEMGREP_RULES \
            --baseline-commit "$BASELINE" \
            --error \
            --json --output semgrep-new.json \
            "$MODULE"

      - name: Résumé du job
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          def load(p):
              try:
                  return json.load(open(p))["results"]
              except Exception:
                  return None
          full, new = load("semgrep-full.json"), load("semgrep-new.json")
          print("## Semgrep - tika-parser-microsoft-module")
          print(f"- Alertes dans le module à ce commit : **{'n/a' if full is None else len(full)}**")
          print(f"- **Nouvelles** alertes par rapport à la référence : **{'n/a' if new is None else len(new)}**")
          if new:
              print("\n| Règle | CWE | Fichier | Ligne |\n|---|---|---|---|")
              for r in new:
                  cwe = ", ".join(r["extra"].get("metadata", {}).get("cwe", []))[:40]
                  path = r["path"].split("/java/")[-1]
                  print(f"| `{r['check_id'].split('.')[-1]}` | {cwe} | `{path}` | {r['start']['line']} |")
          EOF

      - name: Publier les rapports Semgrep
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: rapports-semgrep
          path: semgrep-*.json
          if-no-files-found: ignore

  build:
    name: Build et tests de tika-parser-microsoft-module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Le build ne s'exécute que si aucune nouvelle vulnérabilité n'a été introduite.
    needs: semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Installer le JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compiler le module et ses dépendances (sans tests)
        run: mvn $MAVEN_ARGS -pl "$MODULE" -am install -DskipTests -Drat.skip=true

      - name: Tester le module
        id: tests
        run: mvn $MAVEN_ARGS -pl "$MODULE" test -Drat.skip=true

      # Ne se déclenche que si l'étape de tests elle-même a échoué (pas une
      # erreur de compilation ou d'installation).
      - name: Rickroll si un test échoue
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/rickroll
        with:
          reports-path: ${{ env.MODULE }}/target/surefire-reports
